<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yin-Yang Spinner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Yin-Yang Spinner</h1>
  <canvas id="yy-canvas" width="400" height="400"></canvas>
  <div class="controls">
    <button id="spin-btn">Spin</button>
    <label for="rpm-slider">RPM: <span id="rpm-value">30</span></label>
    <input type="range" id="rpm-slider" min="5" max="720" value="30">
  </div>
  <script src="main.js"></script>
</body>
</html>
